<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081210"/>
      <stop offset="50%" stop-color="#0B1413"/>
      <stop offset="100%" stop-color="#050C0A"/>
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#355949" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#11231F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1413" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6BFFB8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#355949" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B1413" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BFFB8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#355949" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6BFFB8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6BFFB8"/>
      <stop offset="100%" stop-color="#BBE3CE"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- Outer Glass Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="32" fill="none" stroke="url(#cardBorder)" stroke-width="2"/>

  <!-- Decorative Orbit Rings on the right -->
  <g transform="translate(920, 315)">
    <circle cx="0" cy="0" r="210" fill="none" stroke="#355949" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 12"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#BBE3CE" stroke-width="2" stroke-opacity="0.25"/>
    <ellipse cx="0" cy="0" rx="190" ry="75" fill="none" stroke="#6BFFB8" stroke-width="4" stroke-opacity="0.7" transform="rotate(-28)" filter="url(#neon)"/>
    <circle cx="-130" cy="-60" r="10" fill="#6BFFB8" filter="url(#neon)"/>
    <circle cx="140" cy="70" r="7" fill="#BBE3CE"/>
    <polygon points="0,-70 50,0 0,70 -50,0" fill="#6BFFB8" opacity="0.85" filter="url(#neon)"/>
    <polygon points="0,-40 30,0 0,40 -30,0" fill="#FFFFFF"/>
  </g>

  <!-- Content Left -->
  <g transform="translate(100, 130)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(53,89,73,0.3)" stroke="rgba(107,255,184,0.4)" stroke-width="1.5"/>
      <circle cx="20" cy="21" r="5" fill="#6BFFB8" filter="url(#neon)"/>
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#BBE3CE" letter-spacing="1">STUDENT SURVIVAL OS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="76" font-weight="900" fill="#E2F0E8" letter-spacing="-1">
      Shishya <tspan fill="url(#accentGrad)">Yantra</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="600" fill="#BBE3CE">
      Built for bunkers, made for learners.
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="400" fill="#8AAC9A">
      Your all-in-one attendance protector, bunk strategist &amp; academic comeback system.
    </text>

    <!-- Mode Cards -->
    <g transform="translate(0, 290)">
      <!-- Card 1: Bunker Mode -->
      <g>
        <rect x="0" y="0" width="280" height="74" rx="16" fill="rgba(17,31,29,0.7)" stroke="rgba(187,227,206,0.18)" stroke-width="1.5"/>
        <text x="24" y="34" font-size="24">🎯</text>
        <text x="64" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Bunk Tantra</text>
        <text x="64" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#8AAC9A">Attendance &amp; Safe Bunks</text>
      </g>

      <!-- Card 2: Sincere Mode -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="280" height="74" rx="16" fill="rgba(17,31,29,0.7)" stroke="rgba(187,227,206,0.18)" stroke-width="1.5"/>
        <text x="24" y="34" font-size="24">📓</text>
        <text x="64" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Study Mantra</text>
        <text x="64" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#8AAC9A">Focus Timer &amp; Streaks</text>
      </g>
    </g>
  </g>
</svg>