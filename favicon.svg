<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1917"/>
      <stop offset="50%" stop-color="#0B1413"/>
      <stop offset="100%" stop-color="#050B0A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BFFB8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#355949" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#1D3D36" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6BFFB8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6BFFB8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#355949" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1413" stop-opacity="0"/>
    </radialGradient>

    <!-- Glyph Facets -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF5EA"/>
      <stop offset="50%" stop-color="#548973"/>
      <stop offset="100%" stop-color="#1D3D36"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BFFB8"/>
      <stop offset="50%" stop-color="#3F7A64"/>
      <stop offset="100%" stop-color="#152F29"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A806C"/>
      <stop offset="60%" stop-color="#6BFFB8"/>
      <stop offset="100%" stop-color="#0B1413"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6BFFB8" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#6BFFB8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#BBE3CE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6BFFB8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Core Diamond Gradient -->
    <linearGradient id="coreDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#6BFFB8"/>
      <stop offset="100%" stop-color="#355949"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5"/>

  <!-- Radial Backdrop Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#centerGlow)"/>

  <!-- Sacred Geometry Yantra Rings (Subtle) -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#548973" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="#BBE3CE" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Orbiting Attendance Ring (Tilted ellipse representing attendance orbit) -->
  <ellipse cx="256" cy="256" rx="176" ry="64" fill="none" stroke="url(#orbitGrad)" stroke-width="5.5" transform="rotate(-28 256 256)" filter="url(#neonGlow)"/>

  <!-- Orbiting Attendance Energy Particles -->
  <circle cx="116" cy="181" r="9" fill="#6BFFB8" filter="url(#neonGlow)"/>
  <circle cx="396" cy="331" r="6" fill="#BBE3CE" opacity="0.9"/>
  <circle cx="298" cy="204" r="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- Central Crest: Geometric "Y" (Yantra & Scholar Emblem) -->
  <!-- Left Wing -->
  <path d="M 136 156 L 224 156 L 256 252 L 194 266 Z" fill="url(#facetLeft)"/>
  <!-- Right Wing -->
  <path d="M 376 156 L 288 156 L 256 252 L 318 266 Z" fill="url(#facetRight)"/>

  <!-- Central Pillar Stem -->
  <path d="M 238 250 L 274 250 L 265 390 L 256 404 L 247 390 Z" fill="url(#stemGrad)"/>

  <!-- Scholar Mortarboard / Apex Diamond at Top -->
  <polygon points="256,108 296,144 256,158 216,144" fill="#6BFFB8" filter="url(#neonGlow)"/>
  <polygon points="256,116 284,144 256,152 228,144" fill="#FFFFFF" opacity="0.9"/>

  <!-- Core Radiant Yantra Diamond -->
  <polygon points="256,198 296,256 256,314 216,256" fill="url(#coreDiamond)" filter="url(#neonGlow)"/>
  <polygon points="256,216 280,256 256,296 232,256" fill="#FFFFFF" opacity="0.95"/>

  <!-- Glowing Micro Nodes -->
  <circle cx="256" cy="256" r="5" fill="#6BFFB8"/>
</svg>